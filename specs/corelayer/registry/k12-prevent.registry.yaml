# K12 Prevent full-stack preview (RUU-1689).
#
# "K12 Prevent" here is the BTA product: apps/k12-prevent + apps/bta-app in
# ruunis-ui-modules, served against bta-api from X4Org/BTA-POC. It is NOT the
# Mastra `k12` target or the `k12` profile in session-sandboxes.yaml.
#
# Start it (from an x4 checkout on a worker that has the env bundle below):
#
#   x4 registry validate --registry registry/k12-prevent.registry.yaml
#   x4 workspace bootstrap --repo-set k12-prevent --registry registry/k12-prevent.registry.yaml
#   x4 sandbox up --wait --wait-timeout-seconds 900   # from the ruunis-ui-modules entry
#   x4 preview serve                                  # one https://*.preview.x4app.dev per service
#
# Every service is isolated: its own PostgreSQL 16 and Azurite, nothing shared
# with staging. bta-api runs data migrations and background workers at startup,
# so it must never point at a shared database.
#
# Known limits:
#   - Roster is empty. Roster sync is off (placeholder CoreLayer M2M and sync
#     upstreams), and only BTA-POC's own seed-test-incidents data is loaded.
#   - AI, speech-to-text, email and Linear are real providers (testing keys).
#     Mail goes to NOTIFICATION_EMAIL_TO / FEEDBACK_EMAIL_TO, which must be the
#     team test inbox, never a real person (address still to be chosen).
#   - Needs a worker with preview domains (/etc/x4/preview-domains.json;
#     deploy/domains/preview-add-worker.py). VITE_BTA_API_URL must be bta-api's
#     absolute URL when Vite starts, and only generated domains are known
#     before startup. Each sandbox gets its own https://*.preview.x4app.dev
#     origins, so any number of K12 Prevent stacks share a worker. Do not pin
#     preview.port: that gives one stack per worker and fails the next one
#     with "preview port is already in use".
#   - Sign-in needs an https K12 Prevent origin: oidc-client-ts needs a secure
#     context for PKCE, and @maf/web-portal accepts only https (or loopback)
#     OIDC URLs. It requires both OIDC callbacks on the app's own origin, so
#     VITE_OIDC_REDIRECT_URI / VITE_OIDC_POST_LOGOUT_REDIRECT_URI are each
#     sandbox's own /callback and /logout-callback. CoreLayer registers exact
#     callbacks only, so the frontend's issuer is X4's relay
#     (https://auth.x4app.dev/p/corelayer-testing, X4_AUTH_MODE=relay). The relay
#     serves CoreLayer's discovery with its own authorize/token/logout endpoints,
#     gives CoreLayer the fixed https://auth.x4app.dev/callback and
#     /logout-callback, and returns each sign-in to the sandbox that started it.
#     It also forwards the token exchange, so CoreLayer needs no preview CORS.
#     The app is unchanged: eduforge-shell, PKCE, its tokens and BTA calls.
#     CoreLayer must add both auth.x4app.dev callbacks to eduforge-shell.
version: 1

repoSets:
  k12-prevent:
    description: >-
      K12 Prevent (the BTA product): ruunis-ui-modules frontend with BTA-POC's
      bta-api attached under .x4/repos/bta-poc. Not the Mastra k12 target.
    repos:
      - ruunis-ui-modules
      - bta-poc
    envBundle: k12-prevent-testing
    defaultSandboxProfile: k12-prevent
    # The sandbox containers install their own dependencies (both repos need a
    # token for private X4Org/bta-contracts), so the host does not.
    defaultInstallMode: skip
    branchTemplate: feat/{featureSlug}
    fallbackBranchTemplate: x4/{developer}/{date}-{entryRepo}-{shortId}

repos:
  # Generated by `x4 registry init`; defaultBranch, setup, test and env edited.
  ruunis-ui-modules:
    displayName: ruunis-ui-modules
    canonicalRemote: https://github.com/X4Org/ruunis-ui-modules.git
    aliases: []
    # Every pull request targets develop; main only takes release merges.
    defaultBranch: develop
    packageManager: bun
    localMainPath: ~/dev/repos/ruunis-ui-modules
    # Same install as CI: GITHUB_TOKEN must read X4Org/bta-contracts.
    setup:
      - node scripts/install-with-github-auth.mjs --frozen-lockfile
    test:
      - bun run test
    env:
      # Nothing from the main clone: the sandbox gets only the env bundle.
      copyFromMain: []
      forbid:
        - .env.production
        - .env.staging
      mustBeIgnored:
        - .env
        - .env.local
  bta-poc:
    displayName: BTA-POC
    canonicalRemote: git@github.com:X4Org/BTA-POC.git
    aliases: []
    # The shell bearer lane (SHELL_ALLOWED_AZP) and the bta-contracts install
    # exist on develop only.
    defaultBranch: develop
    packageManager: npm
    localMainPath: ~/dev/repos/BTA-POC
    # Without BTA_CONTRACTS_TOKEN, npm-ci.sh uses the caller's git credentials.
    setup:
      - sh scripts/npm-ci.sh
    # The Vitest suite needs a running dev server (its compose `test`
    # profile), so the host check is the type check.
    test:
      - npm run check
    env:
      # A main-clone .env could carry staging values or the forwarded-identity
      # bypass, so nothing is copied.
      copyFromMain: []
      forbid:
        - .env.production
        - .env.prod
      mustBeIgnored:
        - .env

sandboxProfiles:
  k12-prevent:
    description: >-
      K12 Prevent (BTA product, not the Mastra k12 target): k12-prevent
      frontend serving BTA from source, bta-api, and a PostgreSQL and Azurite
      of its own. Real AI and email providers, empty roster, nothing shared.
    executionRuntime: compose
    envBundle: k12-prevent-testing
    services:
      # Matches BTA-POC docker-compose.yml.
      - id: postgres
        repo: bta-poc
        kind: db
        image: postgres:16
        # Throwaway preview data: skip disk flushes so migrations and the roster
        # sync don't wait on a busy testbox's disk.
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        mountRepo: false
        injectEnvFile: false
        containerPort: 5432
        environment:
          POSTGRES_USER: bta
          POSTGRES_PASSWORD: bta
          POSTGRES_DB: bta
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        health:
          type: command
          command: pg_isready -h 127.0.0.1 -U bta -d bta
          interval: 5s
          timeout: 5s
          retries: 20

      # Blob storage for interview audio and case evidence.
      - id: azurite
        repo: bta-poc
        kind: service
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        mountRepo: false
        injectEnvFile: false
        containerPort: 10000
        command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
        health:
          type: tcp
          startPeriod: 30s
          retries: 20

      # X4 has no one-shot services (an exited container fails `sandbox up
      # --wait`) and cannot pass the Dockerfile's bta_contracts_token build
      # secret, so bta-api runs from source on the image its dev target uses,
      # and migrates and seeds before it starts. dependsOn only orders starts,
      # so it waits for PostgreSQL itself. The seed runs only on an empty
      # incidents table. The token is dropped before the server starts.
      # npm ci runs from /tmp: the mounted checkout is a worktree whose .git
      # names a host path, so git (for the bta-contracts dependency) fails
      # inside /app.
      - id: bta-api
        repo: bta-poc
        kind: api
        image: node:24-bookworm
        workingDir: /app
        containerPort: 5000
        command: >-
          sh -c "cd /tmp && sh /app/scripts/npm-ci.sh --prefix /app && cd /app
          && until node -e 'new (require(process.argv[1]).Client)(process.env.DATABASE_URL).connect().then(() => process.exit(0), () => process.exit(1))' pg; do sleep 2; done
          && npm run db:migrate
          && if node -e 'const c = new (require(process.argv[1]).Client)(process.env.DATABASE_URL); c.connect().then(() => c.query(process.argv[2])).then((r) => process.exit(r.rows[0].n === 0 ? 0 : 1))' pg 'select count(*)::int as n from incidents';
          then npx tsx scripts/seed-test-incidents.ts; fi
          && { node -e 'const u=\"http://127.0.0.1:5000\",s=process.env.SYNC_TRIGGER_SECRET,w=t=>new Promise(r=>setTimeout(r,t));(async()=>{if(!s)return;for(let i=0;i<300;i++){try{if((await fetch(u+\"/health\")).ok)break}catch{}await w(2000)}for(let i=0;i<60;i++){try{const r=await fetch(u+\"/admin/sync\",{method:\"POST\",headers:{\"X-Sync-Secret\":s,\"content-type\":\"application/json\"},body:\"{}\"});const b=await r.json().catch(()=>({}));if(r.status===202&&!b.deduplicated){console.log(\"[x4] initial roster sync started\");return}}catch{}await w(3000)}console.log(\"[x4] initial roster sync not started\")})()' & }
          && exec env -u BTA_CONTRACTS_TOKEN npm run dev"
        environment:
          HOME: /tmp/x4-home
          npm_config_cache: /tmp/.npm-cache
          npm_config_audit: "false"
          npm_config_fund: "false"
          NODE_ENV: development
          DATABASE_URL: postgres://bta:bta@postgres:5432/bta
          DATABASE_SSL: disable
          # Placeholders for an isolated preview, not credentials.
          SESSION_SECRET: x4-preview-session-secret
          OBJECT_STORAGE_PROVIDER: azure
          # Azurite's published development account, not a credential.
          AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
          AZURE_STORAGE_CONTAINER: bta-private
          AZURE_STORAGE_PREFIX: private
          AZURE_STORAGE_AUTO_CREATE_CONTAINER: "true"
          # K12 Prevent calls bta-api with the shell's exchanged token only. The
          # portal token exchange issues it as corelayer-exchanger.
          SHELL_ALLOWED_AZP: eduforge-shell,corelayer-exchanger
          # bta-api's own CoreLayer login is off (AUTH_MODE=magic): it would use
          # the placeholder client below, which CoreLayer doesn't have. People
          # sign in through the K12 Prevent frontend; config.ts only requires
          # the OIDC values to be set.
          AUTH_MODE: magic
          OIDC_CLIENT_ID: bta-x4-preview
          OIDC_REDIRECT_URI: http://localhost:5000/api/auth/callback
          OIDC_POST_LOGOUT_URI: http://localhost:5000
          OIDC_SCOPE: openid profile email
          ALLOWED_AZP: bta-x4-preview
          # Roster sync from dev CoreLayer with the bta-sync-local client. A
          # signed-in person needs a synced account, and BTA's startup sync covers
          # districts and facilities only. The command above triggers one full
          # sync (POST /admin/sync, X-Sync-Secret) once bta-api is healthy; the
          # scheduler then runs every minute. CL_PRIVATE_KEY comes from the
          # environment.
          SYNC_SCHEDULE_INTERVAL_MS: "60000"
          CL_CREDENTIAL_ENVIRONMENT: development
          CL_CLIENT_ID: bta-sync-local
          CL_KEY_ID: key-da50fc89-2d3
          SYNC_API_URL: https://sync-dev-core.r2practice.com
          PRIVATE_API_URL: https://private-dev-core.r2practice.com
          SYNC_PAGE_SIZE: "200"
          SYNC_TRIGGER_SECRET: x4-preview-trigger-secret
        # Only the backend's declared inputs, including its private dependency install token.
        bundleEnv:
          keys:
            - BTA_CONTRACTS_TOKEN
            - OIDC_ISSUER
            - EXPECTED_AUDIENCE
            - CL_PRIVATE_KEY
            - OPENAI_API_KEY
            - ELEVENLABS_API_KEY
            - RESEND_API_KEY
            - LINEAR_API_KEY
            - NOTIFICATION_EMAIL_TO
            - FEEDBACK_EMAIL_TO
            - RESEND_FROM_EMAIL
        dependsOn:
          - postgres
          - azurite
        health:
          type: http
          path: /health
          startPeriod: 600s
          interval: 10s
          timeout: 5s
          retries: 20
        evidencePath: /health
        # The browser calls bta-api directly (CORS is *) at its own generated
        # origin, which the frontend gets as VITE_BTA_API_URL.
        preview:
          mode: origin

      # BTA served from source with hot reload (the dev:k12 setup). Vite is
      # started directly because `dev` binds 127.0.0.1, which a published
      # container port cannot reach.
      - id: k12-prevent
        repo: ruunis-ui-modules
        kind: frontend
        image: oven/bun:1.4.0
        workingDir: /app
        containerPort: 3100
        command: >-
          sh -c "GITHUB_TOKEN=$$BTA_CONTRACTS_TOKEN node scripts/install-with-github-auth.mjs --frozen-lockfile
          && cd apps/k12-prevent
          && exec env -u BTA_CONTRACTS_TOKEN bun x vite --host 0.0.0.0 --port 3100 --strictPort"
        environment:
          HOME: /tmp/x4-home
          BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
          VITE_SUITE_ENVIRONMENT: local
          VITE_OIDC_CLIENT_ID: eduforge-shell
          VITE_OIDC_SCOPE: openid profile email offline_access eduforge-portal-access
          # This sandbox's own origins, resolved before startup. They override
          # the shared bundle, so concurrent sandboxes never share an API or
          # login callback route.
          VITE_BTA_API_URL: "{{preview.bta-api.origin}}"
          VITE_OIDC_REDIRECT_URI: "{{preview.k12-prevent.origin}}/callback"
          VITE_OIDC_POST_LOGOUT_REDIRECT_URI: "{{preview.k12-prevent.origin}}/logout-callback"
          # Sign-in and the token exchange go through X4's relay, which gives
          # CoreLayer its fixed callbacks and returns to this sandbox.
          VITE_OIDC_ISSUER: https://auth.x4app.dev/p/corelayer-testing
          VITE_TOKEN_EXCHANGE_URL: https://auth.x4app.dev/p/corelayer-testing/exchange
        # Only the private installation token enters the frontend from the bundle.
        bundleEnv:
          keys:
            - BTA_CONTRACTS_TOKEN
        dependsOn:
          - bta-api
        health:
          type: http
          path: /
          startPeriod: 600s
          interval: 10s
          timeout: 5s
          retries: 20
        testerPath: /
        preview:
          mode: origin

envBundles:
  # Key names only. Values live in the worker's file, never production ones.
  # Do not reuse mastra-testing.
  k12-prevent-testing:
    description: >-
      K12 Prevent preview against testing CoreLayer, with real testing keys for
      OpenAI, ElevenLabs, Resend and Linear. Mail goes to the team test inbox.
    path: /etc/x4/env/k12-prevent-testing.env
    allowMissing: false
    required:
      # Read access to X4Org/bta-contracts, for both installs.
      - BTA_CONTRACTS_TOKEN
      # bta-api, testing CoreLayer.
      - OIDC_ISSUER
      - EXPECTED_AUDIENCE
      # bta-api, the bta-sync-local client's P-256 key (base64url PKCS8 DER).
      - CL_PRIVATE_KEY
      # bta-api, external services.
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - RESEND_API_KEY
      - LINEAR_API_KEY
      # The team test inbox, never a real person.
      - NOTIFICATION_EMAIL_TO
      - FEEDBACK_EMAIL_TO
      # The frontend's VITE_* settings come from sandboxProfiles.k12-prevent:
      # each sandbox's own preview origins, and X4's sign-in relay for the
      # issuer and token exchange. None of them are in this bundle.
    optional:
      - RESEND_FROM_EMAIL
    forbiddenPatterns:
      - "[Pp][Rr][Oo][Dd]([Uu][Cc][Tt][Ii][Oo][Nn])?"
      - "[Ll][Ii][Vv][Ee]"
      # No test-user login or gateway identity (ADR 0034).
      - "BTA_DEV_FORWARDED_IDENTITY"
      - "SUITE_FWD_ID_"
